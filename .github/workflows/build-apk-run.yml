name: Build APK Run Installers

on:
  workflow_dispatch:
    inputs:
      group:
        description: "选择要编译的插件分组"
        type: choice
        required: true
        default: "HomeProxy 代理插件"
        options:
          - "Argon 主题"
          - "Vantage 主题"
          - "Aurora 主题"
          - "Design 主题"
          - "Shadcn 主题"
          - "Fluent 主题"
          - "Fluent Lite 主题"
          - "Mosdns DNS 转换器"
          - "OpenClash 代理插件"
          - "HomeProxy 代理插件"
          - "PassWall 代理插件"
          - "PassWall2 代理插件"
          - "Nikki 代理插件（nikki + mihomo 内核）"
          - "DiskMan 磁盘管理工具"
          - "MentoHUST 认证"
          - "Quickfile 文件管理"
          - "RamFree 内存清理"
          - "Bandix-Plus 网络流量监控"
          - "OpenList 网盘聚合工具"
          - "AirConnect 音频服务"
          - "Autocore 硬件信息"
          - "Socat 端口转发"
          - "AdGuardHome 广告拦截"
          - "Geo 数据工具"
      version:
        description: "OpenWrt 版本（留空=自动使用最新 apk 稳定版，例如 25.12.6）"
        type: string
        required: false
        default: ""
      arch:
        description: "目标架构"
        type: choice
        required: true
        default: "全部架构"
        options:
          - "全部架构"
          - "x86_64"
          - "aarch64_generic"
          - "aarch64_cortex-a53"

permissions:
  contents: write

concurrency:
  group: apk-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
      arches: ${{ steps.detect.outputs.arches }}
    steps:
      - name: Detect OpenWrt apk version and architectures
        id: detect
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VERSION}" ]; then
            V="${IN_VERSION}"
          else
            # 自动取最新的 apk 系（25.x）：stable_version 是 25.x 就用它，否则从
            # versions_list（按新旧排序）里挑第一个 25.x 正式版。OpenWrt 会定期发新版。
            V="$(curl -fsS --retry 3 --retry-delay 3 https://downloads.openwrt.org/.versions.json \
                 | python3 -c "import json,re,sys; d=json.load(sys.stdin); print(next((v for v in [d.get('stable_version','')]+d.get('versions_list',[]) if re.fullmatch(r'25\.\d+\.\d+', v or '')), ''))")"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效的 OpenWrt 版本: $V"
            exit 1
          fi
          MAJOR="${V%%.*}"
          if [ "$MAJOR" -lt 25 ]; then
            echo "::error::OpenWrt ${V} 使用 opkg(ipk)，没有 apk 包。请选择 25.12 或更新版本。"
            exit 1
          fi
          case "${IN_ARCH}" in
            "全部架构") ARCHES='["x86_64","aarch64_generic","aarch64_cortex-a53"]' ;;
            x86_64|aarch64_generic|aarch64_cortex-a53) ARCHES="[\"${IN_ARCH}\"]" ;;
            *) echo "::error::不支持的架构: ${IN_ARCH}"; exit 1 ;;
          esac
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "arches=${ARCHES}" >> "$GITHUB_OUTPUT"
          echo "OpenWrt ${V}, arches ${ARCHES}"

  build:
    name: Build ${{ matrix.arch }} @ ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GROUP_LABEL: ${{ inputs.group }}
    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout openwrt_package as feed
        uses: actions/checkout@v7
        with:
          repository: MinimaxFlora/openwrt_package
          fetch-depth: 0

      - name: Checkout Package_Manager tooling
        uses: actions/checkout@v7
        with:
          path: pm

      - name: Apply DIY settings
        run: |
          set -euo pipefail
          # 与 AutoSync/.github/diy/openwrt_package.sh 的「相关设置」保持一致。
          # feed 里的包用相对路径 include，放到 feed 根目录后解析不到 luci.mk /
          # golang-package.mk；luci.mk 没被 include 就不会登记 luci-base/host 依赖，
          # po2lmo 也就不会被编出来（openclash 的 Build/Prepare 会 Error 127）。
          sed -i 's#include ../../luci.mk#include $(TOPDIR)/feeds/luci/luci.mk#g' luci-theme-design/Makefile || true
          sed -i 's#include ../../lang/golang/golang-package.mk#include $(TOPDIR)/feeds/packages/lang/golang/golang-package.mk#g' sing-box/Makefile || true
          echo "luci-theme-design include -> $(grep -m1 luci.mk luci-theme-design/Makefile || echo '<none>')"
          echo "sing-box golang include -> $(grep -m1 golang-package.mk sing-box/Makefile || echo '<none>')"

      - name: Resolve selected group
        run: |
          set -euo pipefail
          python3 pm/tools/resolve_group.py \
            --src . \
            --groups pm/tools/groups.json \
            --label "${GROUP_LABEL}"

      - name: Show selection
        run: |
          echo "Packages: ${PACKAGES}"
          echo "Group   : ${GROUP_LABEL} (${GROUP_SLUG})"
          echo "Version : ${VERSION}"
          echo "Arch    : ${ARCH}"
          echo "Drop    : ${GROUP_DROP_PKGS:-<none>}"
          echo "Check   : ${GROUP_CHECK_TARGETS:-$PACKAGES}"

      - name: Build packages (apk only)
        uses: MinimaxFlora/gh-action-sdk@go1.27
        env:
          ARCH: ${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          FEEDNAME: packages_ci
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: true

      - name: Collect apk packages
        run: |
          set -euo pipefail
          mkdir -p release
          if [ -d "bin/packages/${ARCH}/packages_ci" ]; then
            find "bin/packages/${ARCH}/packages_ci" -maxdepth 1 -type f -name '*.apk' \
              -exec cp -v {} release/ \;
          fi
          # autocore 属于 nonshared，产物落在 bin/targets 下
          find bin/targets -type f -name 'autocore*.apk' -exec cp -v {} release/ \; 2>/dev/null || true
          # 丢掉互斥变体（例如 sing-box 目标会顺带编出 sing-box-tiny，两者 conflicts，
          # 同时打进一个 .run 必然装不上：apk 报 sing-box conflicts sing-box-tiny）
          for p in ${GROUP_DROP_PKGS:-}; do
            echo "丢弃互斥变体: ${p}"
            rm -f release/"${p}"-*.apk
          done
          count=$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)
          echo "收集到 ${count} 个 apk"
          ls -lh release/ || true
          # 诊断：确认 apk 里有没有带上 .lmo 翻译
          for f in release/*.apk; do
            [ -f "$f" ] || continue
            if tar tzf "$f" >/dev/null 2>&1; then
              n=$(tar tzf "$f" | grep -c '\.lmo$' || true)
              echo "  $(basename "$f"): lmo=${n}"
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::没有产出任何 .apk。请确认版本 ${VERSION} 使用 apk（OpenWrt 25.12+），以及所选分组在该架构上可编译。"
            exit 1
          fi

      - name: Assert selected targets produced packages
        run: |
          set -uo pipefail
          rc=0
          python3 pm/tools/check-artifacts.py \
            --lock ./packages.lock.json \
            --apk-dir release \
            --targets "${GROUP_CHECK_TARGETS:-$PACKAGES}" || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::所选分组有构建目标没有产出 apk，请查看 Build 步骤的编译日志"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::产物校验脚本返回 $rc（2=数据/路径问题），请检查 packages.lock.json 与 PACKAGES"
            exit 1
          fi

      - name: Install makeself
        run: |
          set -euo pipefail
          if ! command -v makeself >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/megastep/makeself.git "$RUNNER_TEMP/makeself"
          fi

      - name: Build make-self-extracting .run installer
        run: |
          set -euo pipefail
          if command -v makeself >/dev/null 2>&1; then
            MS="$(command -v makeself)"
          else
            MS="$RUNNER_TEMP/makeself/makeself.sh"
          fi
          mkdir -p out
          python3 pm/tools/build_run.py \
            --apk-dir release \
            --out-dir out \
            --slug "${GROUP_SLUG}" \
            --label "${GROUP_LABEL}" \
            --arch "${ARCH}" \
            --version "${VERSION}" \
            --makeself "$MS" \
            --complevel 6

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-run-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: out
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: logs
          if-no-files-found: ignore

  release:
    name: Release ${{ matrix.arch }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.arches) }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: apk-run-${{ matrix.arch }}-*
          merge-multiple: true
          path: assets

      - name: Collect .run installers
        id: collect
        run: |
          set -euo pipefail
          mkdir -p run-only
          found=0
          while IFS= read -r f; do
            cp -v "$f" run-only/
            found=$((found + 1))
          done < <(find assets -type f -name '*.run')
          if [ "$found" -eq 0 ]; then
            echo "::error::本次构建没有产出任何 .run 安装包，跳过发布（请先看 Build 任务的报错）"
            exit 1
          fi
          ls -lh run-only

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-${{ matrix.arch }}
          name: APK ${{ matrix.arch }}
          body: |
            OpenWrt / iStoreOS apk 自解压安装包（由 Package_Manager 自动构建）

            - 架构: `${{ matrix.arch }}`
            - OpenWrt 版本: `${{ needs.prepare.outputs.version }}`
            - 插件分组: `${{ inputs.group }}`

            下载对应分组的 `.run`，在设备上以 root 执行即可：

            ```sh
            sh <分组>-<架构>-<版本>.run
            ```

            安装脚本内部执行的是 `apk add --allow-untrusted ./*.apk`；
            这些 apk 由本地 SDK 构建、未签名，所以需要 `--allow-untrusted`。
            需要单个 apk 时请到 Actions 运行页的 artifact 下载，Release 只放 `.run`。
          files: |
            run-only/**/*.run
          fail_on_unmatched_files: true
          overwrite_files: true
